<script>
  const HOST_PASSWORD = "greenbandits";
  const DISCORD_PROXY_URL = "https://bazaar-proxy.jamie-adams1993.workers.dev"; 

  const weeklyItems = [
    {
      id: "ranger_boots",
      name: "Ranger Boots",
      basePrice: 32000000,
      howToGet: "Medium Clue Scroll Reward.",
      icon: "https://oldschool.runescape.wiki/images/Ranger_boots_detail.png"
    },
    {
      id: "dragon_pickaxe",
      name: "Dragon Pickaxe",
      basePrice: 1300000,
      howToGet: "Wildy bosses (Vet'ion, Callisto, Venenatis) or KBD.",
      icon: "https://oldschool.runescape.wiki/images/Dragon_pickaxe_detail.png"
    },
    {
      id: "uncut_onyx",
      name: "Uncut Onyx",
      basePrice: 2800000,
      howToGet: "TzHaar gem shop (300k TokKul) or Zulrah drop.",
      icon: "https://oldschool.runescape.wiki/images/Uncut_onyx_detail.png"
    },
    {
      id: "grimy_ranarr",
      name: "Ranarr Weed x100",
      basePrice: 650000,
      howToGet: "Herb patches, Aberrant Spectres, or Wyverns.",
      icon: "https://oldschool.runescape.wiki/images/Grimy_ranarr_weed_detail.png"
    }
  ];

  let activeItem = null;
  let globalStatuses = {};

  // Fetch shared state live from Cloudflare KV
  async function loadGlobalStatus() {
    try {
      const res = await fetch(`${DISCORD_PROXY_URL}/api/status`);
      if (res.ok) {
        globalStatuses = await res.json();
      }
    } catch (e) {
      console.warn("Could not load global status, falling back to local.");
    }
    renderBazaar();
  }

  // Sync an update to Cloudflare KV
  async function syncStatusUpdate(itemId, status, resetAll = false) {
    try {
      await fetch(`${DISCORD_PROXY_URL}/api/update-status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password: HOST_PASSWORD,
          itemId: itemId,
          status: status,
          resetAll: resetAll
        })
      });
      await loadGlobalStatus();
    } catch (e) {
      alert("Failed to sync change to server.");
    }
  }

  function renderBazaar() {
    const grid = document.getElementById("shopGrid");
    grid.innerHTML = "";

    weeklyItems.forEach(item => {
      const status = globalStatuses[item.id] || "available";
      const bonusPrice = Math.round(item.basePrice * 1.20);

      const card = document.createElement("div");
      card.className = `item-card ${status}`;
      
      if (status === "available") {
        card.onclick = () => openSubmitModal(item);
      } else if (status === "pending") {
        card.onclick = () => alert(`${item.name} has a submission pending clan verification!`);
      }

      let badgeText = "UPLOAD PROOF";
      if (status === "pending") badgeText = "PENDING REVIEW";
      if (status === "sold") badgeText = "OUT OF STOCK";

      card.innerHTML = `
        <div class="cobweb-layer">
          <svg class="cobweb-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0,0 Q35,10 50,50 Q10,35 0,0" stroke="#ccc" stroke-width="0.7" fill="none"/>
            <path d="M0,0 Q50,20 85,85 Q20,50 0,0" stroke="#aaa" stroke-width="0.7" fill="none"/>
            <path d="M100,0 Q65,10 50,50 Q90,35 100,0" stroke="#ccc" stroke-width="0.7" fill="none"/>
            <path d="M100,0 Q50,20 15,85 Q80,50 100,0" stroke="#aaa" stroke-width="0.7" fill="none"/>
            <path d="M15,0 Q25,25 0,30 M30,0 Q40,40 0,45" stroke="#999" stroke-width="0.5" fill="none"/>
            <path d="M85,0 Q75,25 100,30 M70,0 Q60,40 100,45" stroke="#999" stroke-width="0.5" fill="none"/>
            <path d="M0,100 Q40,60 50,50 M100,100 Q60,60 50,50" stroke="#888" stroke-width="0.6" fill="none"/>
            <line x1="0" y1="0" x2="100" y2="100" stroke="#bbb" stroke-width="0.4" stroke-dasharray="2,2"/>
            <line x1="100" y1="0" x2="0" y2="100" stroke="#bbb" stroke-width="0.4" stroke-dasharray="2,2"/>
          </svg>
          <div class="sold-stamp">ITEM SOLD &amp; CLAIMED</div>
        </div>

        <img class="item-icon" src="${item.icon}" alt="${item.name}">
        <div class="item-title">${item.name}</div>
        <div class="price-line">Base: ${(item.basePrice >= 1e6 ? (item.basePrice/1e6).toFixed(1) + 'M' : (item.basePrice/1e3).toFixed(0) + 'k')} gp</div>
        <div class="bazaar-price">Bazaar: ${(bonusPrice >= 1e6 ? (bonusPrice/1e6).toFixed(2) + 'M' : (bonusPrice/1e3).toFixed(0) + 'k')} gp</div>
        <div class="action-tag">${badgeText}</div>
      `;
      grid.appendChild(card);
    });
  }

  function openSubmitModal(item) {
    activeItem = item;
    const bonusPrice = Math.round(item.basePrice * 1.20);

    document.getElementById("mIcon").src = item.icon;
    document.getElementById("mName").textContent = item.name;
    document.getElementById("mHowTo").textContent = item.howToGet;
    document.getElementById("mBase").textContent = item.basePrice.toLocaleString();
    document.getElementById("mPayout").textContent = bonusPrice.toLocaleString();
    document.getElementById("statusMsg").textContent = "";
    document.getElementById("submitForm").reset();

    document.getElementById("submitModal").style.display = "flex";
  }

  function openHostModal() {
    const entered = prompt("🔐 Clan Host Authorization:\nEnter password:");
    if (entered === null) return;
    if (entered.trim() !== HOST_PASSWORD) {
      alert("❌ Incorrect password.");
      return;
    }

    const hostList = document.getElementById("hostItemsList");
    hostList.innerHTML = "";

    weeklyItems.forEach(item => {
      const status = globalStatuses[item.id] || "available";
      const row = document.createElement("div");
      row.className = "host-item-row";
      row.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          <span style="font-size: 0.72rem; color: ${status === 'sold' ? '#ff4444' : (status === 'pending' ? '#ff981f' : '#37bf37')}">
            Status: ${status.toUpperCase()}
          </span>
        </div>
        <div>
          ${status !== 'sold' ? `<button class="btn-sm btn-verify" onclick="syncStatusUpdate('${item.id}', 'sold'); openHostModal();">Verify &amp; Mark Sold</button>` : ''}
          ${status !== 'available' ? `<button class="btn-sm btn-reopen" onclick="syncStatusUpdate('${item.id}', null); openHostModal();">Re-open Slot</button>` : ''}
        </div>
      `;
      hostList.appendChild(row);
    });

    document.getElementById("hostModal").style.display = "flex";
  }

  async function resetAllItems() {
    if (confirm("Are you sure you want to reset all item slots for a new week?")) {
      await syncStatusUpdate(null, null, true);
      closeModals();
      alert("✅ All shop items reset for everyone!");
    }
  }

  function closeModals() {
    document.getElementById("submitModal").style.display = "none";
    document.getElementById("hostModal").style.display = "none";
    activeItem = null;
  }

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });

  async function handleSubmit(e) {
    e.preventDefault();
    const rsn = document.getElementById("rsn").value.trim();
    const file = document.getElementById("proof").files[0];
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");

    if (!file || !activeItem) return;

    if (file.size > 8 * 1024 * 1024) {
      statusMsg.style.color = "#ff4444";
      statusMsg.textContent = "File too large! Max file size is 8MB.";
      return;
    }

    submitBtn.disabled = true;
    statusMsg.style.color = "#ff981f";
    statusMsg.textContent = "Sending screenshot to Discord staff...";

    const bonusPrice = Math.round(activeItem.basePrice * 1.20);

    try {
      const formData = new FormData();
      const payload = {
        content: `🏹 **New Bazaar Item Awaiting Verification!**`,
        embeds: [{
          title: `Bazaar Claim: ${activeItem.name}`,
          color: 16750623,
          fields: [
            { name: "RuneScape Name", value: rsn, inline: true },
            { name: "Payout Owed (+20%)", value: `${bonusPrice.toLocaleString()} gp`, inline: true },
            { name: "Status", value: "⏳ Pending Staff Verification", inline: true }
          ],
          footer: { text: "The Green Bandits Bazaar" },
          timestamp: new Date().toISOString()
        }]
      };

      formData.append("payload_json", JSON.stringify(payload));
      formData.append("item_id", activeItem.id);
      formData.append("file", file, file.name);

      const res = await fetch(DISCORD_PROXY_URL, { 
        method: "POST", 
        body: formData 
      });

      if (!res.ok) throw new Error("Worker rejected submission");

      statusMsg.style.color = "#37bf37";
      statusMsg.textContent = "Proof submitted! Awaiting clan verification.";

      // Reload global state so it flips to PENDING for everyone
      await loadGlobalStatus();

      setTimeout(() => {
        closeModals();
        submitBtn.disabled = false;
      }, 1500);

    } catch (err) {
      statusMsg.style.color = "#ff4444";
      statusMsg.textContent = "Submission failed. Check network or Discord settings.";
      submitBtn.disabled = false;
    }
  }

  // Load the shared global state as soon as anyone opens the site
  loadGlobalStatus();
</script>
